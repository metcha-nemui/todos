<!DOCTYPE html>
<html lang="ja">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css">
   <script src="https://unpkg.com/lucide@latest"></script>
   <title>ToDo App</title>
</head>
<body>
   <div class="container">
      <div class="nav-tabs">
         <button class="tab-btn active" data-target="view-today">メイン</button>
         <button class="tab-btn" data-target="view-debug">デバッグ</button>
      </div>
      
      <!-- 今日ビュー -->
      <div id="view-today" class="view-section active">
         <div class="main-layout">
            <!-- 今日のタスクパネル -->
            <div class="panel">
               <div class="panel-header" style="flex-wrap: wrap; gap: 10px;">
                  <div class="date-control" style="display: flex; align-items: center; gap: 10px;">
                     <span class="date-picker-wrapper">
                        <input type="date" id="date-picker" class="date-picker">
                        <i data-lucide="calendar-days"></i>
                     </span>
                     <span class="date-display" id="current-date-text" style="font-size: 1.5rem; font-weight: bold;"></span>
                     <button id="btn-next-day"><i data-lucide="chevron-right"></i></button>
                  </div>
                  <div style="display: flex; gap: 5px;">
                     <button id="btn-copy-todo" class="secondary" style="padding: 4px 8px; font-size: 0.8rem;"><i data-lucide="copy"></i> ToDo</button>
                     <button id="btn-copy-done" class="secondary" style="padding: 4px 8px; font-size: 0.8rem;"><i data-lucide="copy"></i> Done</button>
                  </div>
               </div>
               
               <div id="container-today-tasks">
                  <!-- ToDo (未完了) -->
                  <div class="backlog-group">
                     <div class="backlog-title">ToDo (未完了)</div>
                     <form class="todo-input-form" id="form-add-todo" style="margin-bottom: 15px;">
                        <input type="text" id="input-todo-title" placeholder="新しいタスクを入力..." required>
                        <input type="date" id="input-todo-date">
                        <button type="submit">追加</button>
                     </form>
                     <ul class="task-list" id="list-todo"></ul>
                  </div>
                  
                  <!-- Done (完了) -->
                  <div class="backlog-group" style="margin-top: 20px;">
                     <div class="backlog-title">Done (完了)</div>
                     <ul class="task-list" id="list-done"></ul>
                  </div>
               </div>
            </div>

            <!-- 今後のタスクパネル -->
            <div class="panel">
               <div class="panel-header">
                  <h2>今後のタスク</h2>
               </div>
               <div id="container-backlog-tasks"></div>
            </div>
         </div>
      </div>
      
      <!-- デバッグビュー -->
      <div id="view-debug" class="view-section">
         <div class="panel">
            <div class="panel-header">
               <h2>localStorage データ一覧</h2>
               <button id="btn-clear-all-debug" class="danger">ストレージ全削除</button>
            </div>
            <div id="container-debug"></div>
         </div>
      </div>
   </div>
   
   <script type="module" src="app.js"></script>
   <script>
      // 初回アイコンレンダリング
      lucide.createIcons();
   </script>
</body>
</html>
