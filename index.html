<!DOCTYPE html>
<html lang="ja">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css">
   <title>ToDo App</title>
</head>
<body>
   <div class="container">
      <header>
         <div class="date-control">
            <span class="date-display" id="current-date-text">2026-06-06</span>
            <button id="btn-next-day">翌日へ進む →</button>
            <input type="date" id="date-picker" style="padding: 6px; border: 1px solid var(--border-color); border-radius: 4px;">
         </div>
      </header>
      
      <div class="nav-tabs">
         <button class="tab-btn active" data-target="view-today">メイン</button>
         <button class="tab-btn" data-target="view-debug">デバッグ</button>
      </div>
      
      <!-- 今日ビュー -->
      <div id="view-today" class="view-section active">
         <div class="main-layout">
            <!-- Doneパネル -->
            <div class="panel">
               <div class="panel-header">
                  <h2>Done (完了)</h2>
                  <button id="btn-copy-done" class="secondary">MDコピー</button>
               </div>
               <ul class="task-list" id="list-done"></ul>
            </div>

            <!-- ToDoパネル -->
            <div class="panel">
               <div class="panel-header">
                  <h2>ToDo (未完了)</h2>
                  <button id="btn-copy-todo" class="secondary">MDコピー</button>
               </div>
               <form class="todo-input-form" id="form-add-todo">
                  <input type="text" id="input-todo-title" placeholder="新しいタスクを入力..." required>
                  <input type="date" id="input-todo-date">
                  <button type="submit">追加</button>
               </form>
               <ul class="task-list" id="list-todo"></ul>
            </div>

            <!-- 今後のタスクパネル -->
            <div class="panel">
               <div class="panel-header">
                  <h2>今後のタスク</h2>
               </div>
               <div id="container-backlog-tasks"></div>
            </div>
         </div>
      </div>
      
      <!-- デバッグビュー -->
      <div id="view-debug" class="view-section">
         <div class="panel">
            <div class="panel-header">
               <h2>localStorage データ一覧</h2>
               <button id="btn-clear-all-debug" class="danger">ストレージ全削除</button>
            </div>
            <div id="container-debug"></div>
         </div>
      </div>
   </div>
   
   <script type="module" src="app.js"></script>
</body>
</html>
