<!DOCTYPE html>
<html lang="ja">
<head>
   <meta charset="UTF-8">
   <meta name="robots" content="noindex, nofollow, noarchive">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
   
   <link rel="stylesheet" href="style.css">
   <script src="https://unpkg.com/lucide@latest"></script>
   <title>ToDo App</title>
</head>
<body>
   <div class="container">
      <!-- 今日ビュー -->
      <div id="view-today" class="view-section active">
         <div class="main-layout">
            <!-- 今日のタスクパネル -->
            <div class="panel">
               <div class="panel-header" style="flex-wrap: wrap; gap: 10px;">
                  <h2>本日のタスク</h2>
                  <div class="date-control" style="display: flex; align-items: center; gap: 10px;">
                     <input type="date" id="date-picker" class="date-picker">
                     <i data-lucide="calendar-days"></i>
                     <span class="date-display" id="current-date-text"></span>
                  </div>
               </div>
               
               <div id="container-today-tasks">
                  <!-- Done (完了) -->
                  <details id="details-done" class="backlog-group" open style="margin-top: 20px;">
                     <summary class="backlog-title">
                        <span>Done</span>
                        <span id="list-count-done" class="list-count"></span>
                        <button id="btn-copy-done" class="secondary btn-copy"><i data-lucide="copy"></i></button>
                     </summary>
                     <ul class="task-list" id="list-done"></ul>
                  </details>
                  
                  <!-- ToDo (未完了) -->
                  <details id="details-todo" class="backlog-group" open>
                     <summary class="backlog-title">
                        <span>ToDo</span>
                        <span id="list-count-todo" class="list-count"></span>
                        <button id="btn-copy-todo" class="secondary btn-copy"><i data-lucide="copy"></i></button>
                        <button id="btn-pip">PiP</button>
                     </summary>
                     <form class="todo-input-form" id="form-add-todo">
                        <input type="text" id="input-todo-title" placeholder="新しいタスクを入力..." required>
                        <button type="submit">追加</button>
                     </form>
                     <ul class="task-list" id="list-todo"></ul>
                  </details>
               </div>
               
               <div>
                  <details id="details-diary" class="backlog-group">
                     <summary class="backlog-title">Diary</summary>
                     <div class="diary-content">
                        <textarea id="input-diary"></textarea>
                        <div style="font-size:1.2rem; text-align:right; color:var(--text-muted)">
                           <span id="diary-counter"></span> / 140
                        </div>
                     </div>
                  </details>
               </div>
            </div>
            
            <!-- 今後のタスクパネル -->
            <div class="panel">
               <div class="panel-header">
                  <h2>今後のタスク</h2>
               </div>
               <form class="todo-input-form form-add-backlog" id="form-add-backlog">
                  <input type="text" id="input-backlog-title" placeholder="今後のタスクを入力..." required>
                  <input type="date" id="input-backlog-date">
                  <button type="submit">追加</button>
               </form>
               <div id="container-backlog-tasks"></div>
            </div>
         </div>
      </div>
   </div>
   
   <!-- Config Modal -->
   <div id="config-modal" class="modal" style="display:none;">
      <div class="modal-content">
         <h2>Supabase 設定</h2>
         <label>URL: <input type="text" id="supabase-url" placeholder="https://xxxx.supabase.co"></label><br>
         <label>Anon Key: <input type="text" id="supabase-key" placeholder="anon key"></label><br>
         <button id="save-config">保存</button>
      </div>
   </div>
   
   <!-- PiP -->
   <template id="pip-content">
      <style>
         html {
            height: 100%;
         }
         body {
            display: flex;
            flex-direction: column;
            margin: 0;
            height: 100%;
            color: white;
            font-size: 14px;
            background: oklch(13% 0.028 261.692);
         }
         .wrapper {
            width: 100%;
            flex-grow: 1;
         }
         .task {
            padding: 0.5em;
            border-bottom: 1px solid oklch(27.8% 0.033 256.848);
            box-sizing: border-box;
         }
         .task:nth-child(2n) {
            background: oklch(21% 0.034 264.665);
         }
         .task.is-active {
            background: linear-gradient(
               to bottom,
               oklch(54.6% 0.245 262.881),
               oklch(37.9% 0.146 265.522)
            );
         }
         .footer {
            text-align: right;
            padding-inline: 0.5em;
         }
         .timer {
            font-size: 60px;
            font-weight: bold;
            font-family: "Calibri", sans-serif;
            background: linear-gradient(to bottom, white, oklch(70.7% 0.022 261.325));
            background-clip: text;
            color: transparent;
         }
         .timer.is-active {
            background: linear-gradient(to bottom, oklch(87.1% 0.15 154.449), oklch(72.3% 0.219 149.579));
            background-clip: text;
            color: transparent;
         }
         .timer.is-end {
            background: linear-gradient(to bottom, oklch(80.9% 0.105 251.813), oklch(62.3% 0.214 259.815));
            background-clip: text;
            color: transparent;
         }
         /* .sec {
            font-size: 45px;
         } */
      </style>
      <div id="wrapper" class="wrapper"></div>
      <div class="footer">
         <span id="timer" class="timer">00:00.00</span>
      </div>
      
      <script type="module">
         let currentIndex = -1;
         document.addEventListener("click", onClick);
         
         function  onClick() {
            const tasks = document.querySelectorAll(".task");
            const timer = document.querySelector("#timer");
            if(currentIndex >= 0) {
               const task = tasks[currentIndex];
               task.classList.remove("is-active");
            }
            currentIndex++;
            if(currentIndex < tasks.length) {
               const task = tasks[currentIndex];
               task.classList.add("is-active");
               timer.classList.add("is-active");
               startTimer();
            } else {
               stopTimer();
               timer.classList.remove("is-active");
               timer.classList.add("is-end");
               document.removeEventListener("click", onclick);
            }
         }
         
         let startTime = 0;
         let elapsedTime = 0;
         let timerInterval = null;
         let isRunning = false;
         
         const timerDisplay = document.getElementById('timer');
         
         function startTimer() {
            isRunning = true;
            startTime = performance.now() - elapsedTime;
            timerInterval = requestAnimationFrame(updateTimer);
         }
         function stopTimer() {
            isRunning = false;
            cancelAnimationFrame(timerInterval);
         }
         function updateTimer() {
            if (!isRunning) return;
            
            // 現在時刻と開始時刻の差分から正確な経過時間を計算
            elapsedTime = performance.now() - startTime;
            
            // 分・秒・ミリ秒（2桁）の計算
            const minutes = Math.floor(elapsedTime / 60000);
            const seconds = Math.floor((elapsedTime % 60000) / 1000);
            // 10ミリ秒単位（小数点以下2桁）にするため1000で割った余りを10で割る
            const centiseconds = Math.floor((elapsedTime % 1000) / 10);
            
            // 桁数を2桁に揃える (例: 1秒 -> "01")
            const mm = String(minutes).padStart(2, '0');
            const ss = String(seconds).padStart(2, '0');
            const cc = String(centiseconds).padStart(2, '0');
            
            // 画面に反映
            timerDisplay.textContent = `${mm}:${ss}.${cc}`;
            
            // 次のフレームの描画を予約
            timerInterval = requestAnimationFrame(updateTimer);
         }
      </script>
   </template>
   
   <script>
      document.addEventListener('DOMContentLoaded', () => {
         const cfg = localStorage.getItem('supabaseConfig');
         if(!cfg) {
            const modal = document.getElementById('config-modal');
            modal.style.display = 'flex';
            document.getElementById('save-config').addEventListener('click', () => {
               const url = document.getElementById('supabase-url').value.trim();
               const key = document.getElementById('supabase-key').value.trim();
               if (url && key) {
                  const stored = { SUPABASE_URL: url, SUPABASE_ANON_KEY: key };
                  localStorage.setItem('supabaseConfig', JSON.stringify(stored));
                  window.location.reload();
               } else {
                  alert('URL とキーを入力してください');
               }
            });
         }
      });
   </script>
   <script type="module" src="app.js"></script>
   <script>
      // 初回アイコンレンダリング
      lucide.createIcons();
   </script>
</body>
</html>
