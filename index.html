<!DOCTYPE html>
<html lang="ja">
<head>
   <meta charset="UTF-8">
   <meta name="robots" content="noindex, nofollow, noarchive">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
   <!-- PWA (ホーム画面に追加したときの名前・アイコン・表示方法) -->
   <link rel="manifest" href="manifest.webmanifest">
   <meta name="theme-color" content="#f5f7fa">
   <meta name="mobile-web-app-capable" content="yes">
   <meta name="apple-mobile-web-app-title" content="ToDo">
   <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
   <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
   
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
   
   <link rel="stylesheet" href="style.css">
   <script src="https://unpkg.com/lucide@1.55.0"></script>
   <title>ToDo App</title>
</head>
<body>
   <!-- 画面上部の通知 (動作は view/panels/statusBanner.js) -->
   <div id="status-banner" class="status-banner" role="status" hidden>
      <span id="status-banner-text"></span>
      <span id="status-banner-actions" class="status-banner-actions">
         <button type="button" id="btn-status-retry">再読み込み</button>
         <button type="button" data-open-config>接続設定</button>
      </span>
   </div>
   
   <div class="container">
      <!-- 今日ビュー -->
      <div id="view-today">
         <div class="main-layout">
            <!-- 今日のタスクパネル -->
            <div class="panel">
               <div class="panel-header">
                  <h2>本日のタスク</h2>
                  <div class="date-nav">
                     <button type="button" id="btn-date-prev" class="secondary" title="前日" aria-label="前日"><i data-lucide="chevron-left"></i></button>
                     <div class="date-control">
                        <input type="date" id="date-picker" class="date-picker">
                        <i data-lucide="calendar-days"></i>
                        <span class="date-display" id="current-date-text"></span>
                     </div>
                     <button type="button" id="btn-date-next" class="secondary" title="翌日" aria-label="翌日"><i data-lucide="chevron-right"></i></button>
                  </div>
               </div>
               
               <div id="container-today-tasks">
                  <!-- Done (今日) -->
                  <details id="details-done" class="collapse" open>
                     <summary class="collapse-title">
                        <span>Done</span>
                        <span id="list-count-done" class="list-count"></span>
                        <button id="btn-copy-done" class="secondary summary-btn"><i data-lucide="copy"></i></button>
                        <button type="button" id="btn-heatmap" class="summary-action"><i data-lucide="sprout"></i>草</button>
                     </summary>
                     <form class="todo-input-form" id="form-add-done">
                        <div class="autocomplete-wrapper">
                           <input type="text" id="input-done-title" placeholder="実行済タスクを入力..." autocomplete="off" required style="anchor-name:--input-done-anchor">
                           <div id="suggest-done-title" class="suggest-list" popover="manual" style="position-anchor:--input-done-anchor"></div>
                        </div>
                        <button type="submit">追加</button>
                     </form>
                     <ul class="task-list" id="list-done"></ul>
                  </details>
                  
                  <!-- ToDo (今日) -->
                  <details id="details-todo" class="collapse" open>
                     <summary class="collapse-title">
                        <span>ToDo</span>
                        <span id="list-count-todo" class="list-count"></span>
                        <button id="btn-copy-todo" class="secondary summary-btn"><i data-lucide="copy"></i></button>
                        <button id="btn-pip" class="summary-action">PiP</button>
                     </summary>
                     <form class="todo-input-form" id="form-add-todo">
                        <div class="autocomplete-wrapper">
                           <input type="text" id="input-todo-title" placeholder="新しいタスクを入力..." autocomplete="off" required style="anchor-name:--input-todo-anchor">
                           <div id="suggest-todo-title" class="suggest-list" popover="manual" style="position-anchor:--input-todo-anchor"></div>
                        </div>
                        <button type="submit">追加</button>
                     </form>
                     <ul class="task-list" id="list-todo"></ul>
                     <div id="toggle-todo-ellipsis" class="toggle-todo-ellipsis">
                        <div id="todo-ellipsis-on"><i data-lucide="plus"></i><span>すべて表示</span></div>
                        <div id="todo-ellipsis-off" hidden><i data-lucide="minus"></i><span>折りたたむ</span></div>
                     </div>
                  </details>
               </div>
               
               <div>
                  <details id="details-diary" class="collapse">
                     <summary class="collapse-title">
                        <span>Diary</span>
                        <button type="button" id="btn-diary-list" class="summary-action"><i data-lucide="list"></i>過去の日記</button>
                     </summary>
                     <div class="diary-content">
                        <textarea id="input-diary"></textarea>
                        <div class="diary-count">
                           <span id="diary-counter"></span> / 140
                        </div>
                     </div>
                  </details>
               </div>
            </div>
            
            <!-- 今後のタスクパネル -->
            <div class="panel">
               <div class="panel-header">
                  <h2>今後のタスク</h2>
               </div>
               <form class="todo-input-form form-add-backlog" id="form-add-backlog">
                  <div class="autocomplete-wrapper">
                     <input type="text" id="input-backlog-title" placeholder="今後のタスクを入力..." autocomplete="off" required style="anchor-name:--input-backlog-anchor">
                     <div id="suggest-backlog-title" class="suggest-list" popover="manual" style="position-anchor:--input-backlog-anchor"></div>
                  </div>
                  <input type="date" id="input-backlog-date">
                  <button type="submit">追加</button>
               </form>
               <div id="container-backlog-tasks"></div>
            </div>
         </div>
      </div>
      
      <div class="app-footer">
         <button type="button" class="secondary" data-open-config>接続設定</button>
      </div>
   </div>
   
   <!-- Config Modal (動作は view/modals/config.js) -->
   <div id="config-modal" class="modal" hidden>
      <div class="modal-content">
         <h2>Supabase 設定</h2>
         <label>URL: <input type="text" id="supabase-url" placeholder="https://xxxx.supabase.co"></label><br>
         <label>Anon Key: <input type="text" id="supabase-key" placeholder="anon key"></label><br>
         <button id="save-config">保存</button>
         <button type="button" id="cancel-config" class="secondary" hidden>キャンセル</button>
      </div>
   </div>
   
   <!-- サジェスト候補の登録画面 (動作は view/modals/template.js) -->
   <div id="template-modal" class="modal" hidden>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="template-modal-title">
         <div class="modal-header">
            <h2 id="template-modal-title">サジェスト候補</h2>
            <button type="button" id="btn-template-close" class="secondary" title="閉じる" aria-label="閉じる"><i data-lucide="x"></i></button>
         </div>
         <form class="todo-input-form" id="form-add-template">
            <input type="text" id="input-template-name" placeholder="新しい候補を入力..." autocomplete="off" required>
            <button type="submit">追加</button>
         </form>
         <ul class="modal-list" id="list-template"></ul>
         <p class="empty-text" id="template-empty" hidden>候補はまだありません</p>
      </div>
   </div>

   <!-- 過去の日記の一覧 (動作は view/modals/diaryList.js) -->
   <div id="diary-list-modal" class="modal" hidden>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="diary-list-modal-title">
         <div class="modal-header">
            <h2 id="diary-list-modal-title">過去の日記</h2>
            <button type="button" id="btn-diary-list-close" class="secondary" title="閉じる" aria-label="閉じる"><i data-lucide="x"></i></button>
         </div>
         <ul class="modal-list" id="list-diary"></ul>
         <p class="empty-text" id="diary-list-empty" hidden>日記はまだありません</p>
      </div>
   </div>

   <!-- 日ごとの Done 件数のヒートマップ (動作は view/modals/heatmap.js) -->
   <div id="heatmap-modal" class="modal" hidden>
      <div class="modal-dialog modal-dialog-wide" role="dialog" aria-modal="true" aria-labelledby="heatmap-modal-title">
         <div class="modal-header">
            <h2 id="heatmap-modal-title">Done の記録</h2>
            <button type="button" id="btn-heatmap-close" class="secondary" title="閉じる" aria-label="閉じる"><i data-lucide="x"></i></button>
         </div>
         <div class="heatmap-months" id="heatmap-months"></div>
         <p class="empty-text" id="heatmap-empty" hidden>記録はまだありません</p>
         <div class="heatmap-footer">
            <span id="heatmap-total"></span>
            <span class="heatmap-legend">
               少
               <span class="heatmap-cell" data-level="0"></span>
               <span class="heatmap-cell" data-level="1"></span>
               <span class="heatmap-cell" data-level="2"></span>
               <span class="heatmap-cell" data-level="3"></span>
               <span class="heatmap-cell" data-level="4"></span>
               多
            </span>
         </div>
      </div>
   </div>

   <!-- PiP (スタイルは pip.css、動作は view/parts/pip.js) -->
   <template id="pip-content">
      <div id="wrapper" class="wrapper"></div>
      <div class="footer">
         <span id="timer" class="timer">00:00.<span class="sec">00</span></span>
      </div>
   </template>
   
   <script type="module" src="view/modals/config.js"></script>
   <script type="module" src="app.js"></script>
   <script>
      lucide.createIcons();
   </script>
</body>
</html>
