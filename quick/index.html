<!DOCTYPE html>
<html lang="ja">
<head>
   <meta charset="UTF-8">
   <meta name="robots" content="noindex, nofollow, noarchive">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <link rel="manifest" href="manifest.webmanifest">
   <meta name="theme-color" content="#fafafa">
   <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">

<link rel="stylesheet" href="../style.css">
   <link rel="stylesheet" href="style.css">
   <!-- 描画前に配色を当てる (チラつき防止) -->
   <script>
      const savedTheme = localStorage.getItem('todo_theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
   </script>
   <title>ToDo クイック登録</title>
</head>
<body>
   <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" data-quick-kind="todo" aria-selected="true">ToDo</button>
      <button type="button" class="tab" role="tab" data-quick-kind="done" aria-selected="false">Done</button>
   </div>

   <form class="todo-input-form quick-form" id="form-quick-add">
      <input type="text" id="input-quick-title" placeholder="タスクを入力..." autocomplete="off" required disabled>
      <div class="quick-date-row">
         <button type="button" id="input-quick-date" class="date-field" title="日付"></button>
         <button type="button" class="secondary quick-date-btn" data-quick-date="today">今日</button>
         <button type="button" class="secondary quick-date-btn" data-quick-date="tomorrow">明日</button>
         <button type="button" class="secondary quick-date-btn" data-quick-date="none">日付なし</button>
         <button type="submit" id="btn-quick-add" disabled>追加</button>
      </div>
   </form>

   <p class="quick-message" id="quick-message" role="status">
      <span id="quick-message-text"></span>
      <button type="button" id="btn-quick-retry" class="secondary" hidden>再読み込み</button>
      <a href="../index.html" target="_blank" id="link-quick-main" hidden>本編を開く</a>
   </p>

   <script type="module" src="app.js"></script>
</body>
</html>
