<!DOCTYPE html>
<html lang="ja">
<head>
   <meta charset="UTF-8">
   <meta name="robots" content="noindex, nofollow, noarchive">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="theme-color" content="#fafafa">
   <title>ToDo App</title>
   <!-- 配色テーマ (本編の style.css と同じ考え方。既定は端末の設定に合わせる) -->
   <script>
      const savedTheme = localStorage.getItem('todo_theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
   </script>
   <!-- オフライン時に sw.js が返すページ。外部ファイルを読めない状況で出すので、スタイルもここに書く -->
   <style>
      :root {
         color-scheme: light dark;
      }

      :root[data-theme="light"] {
         color-scheme: light;
      }

      :root[data-theme="dark"] {
         color-scheme: dark;
      }

      body {
         margin: 0;
         min-height: 100vh;
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         gap: 20px;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         background: light-dark(oklch(0.985 0.003 286), oklch(0.145 0.006 286));
         color: light-dark(oklch(0.21 0.008 286), oklch(0.845 0.003 286));
      }

      p {
         margin: 0;
         font-size: 18px;
         font-weight: 700;
      }

      button {
         background: light-dark(oklch(0.511 0.262 277), oklch(0.585 0.233 293));
         color: oklch(0.985 0.005 293);
         border: none;
         padding: 10px 16px;
         border-radius: 6px;
         font-size: 14px;
         cursor: pointer;
      }
   </style>
</head>
<body>
   <p>オフラインです</p>
   <button type="button" id="btn-reload">再読み込み</button>

   <script>
      // 接続が戻ったら自動で開き直す
      document.getElementById('btn-reload').addEventListener('click', () => window.location.reload());
      window.addEventListener('online', () => window.location.reload());
   </script>
</body>
</html>
