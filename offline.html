<!DOCTYPE html>
<html lang="ja">
<head>
   <meta charset="UTF-8">
   <meta name="robots" content="noindex, nofollow, noarchive">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="theme-color" content="#f5f7fa">
   <title>ToDo App</title>
   <!-- オフライン時に sw.js が返すページ。外部ファイルを読めない状況で出すので、スタイルもここに書く -->
   <style>
      body {
         margin: 0;
         min-height: 100vh;
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         gap: 20px;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         background: #f5f7fa;
         color: #0f172a;
      }

      p {
         margin: 0;
         font-size: 18px;
         font-weight: 700;
      }

      button {
         background: #4f46e5;
         color: #ffffff;
         border: none;
         padding: 10px 16px;
         border-radius: 6px;
         font-size: 14px;
         cursor: pointer;
      }
   </style>
</head>
<body>
   <p>オフラインです</p>
   <button type="button" id="btn-reload">再読み込み</button>

   <script>
      // 接続が戻ったら自動で開き直す
      document.getElementById('btn-reload').addEventListener('click', () => window.location.reload());
      window.addEventListener('online', () => window.location.reload());
   </script>
</body>
</html>
